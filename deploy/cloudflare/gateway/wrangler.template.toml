# Archive Center public Container gateway — deployment template.
#
# The generated gateway config is ignored. It receives the account-scoped
# Container image URI and private bridge URL at deploy time; neither belongs in
# tracked source. BRIDGE_TOKEN and AC_BEARER_TOKEN are Worker secrets.

name = "archive-center-gateway"
main = "src/index.ts"
compatibility_date = "2026-06-01"

[vars]
# BRIDGE_URL is rendered from a protected deployment value. It is the only
# Container-to-Worker endpoint; the Container receives no Cloudflare API token.

[[durable_objects.bindings]]
name = "ARCHIVE_CENTER"
class_name = "ArchiveCenterContainer"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ArchiveCenterContainer"]

[[containers]]
class_name = "ArchiveCenterContainer"
# Replaced by the ignored renderer output with a Cloudflare Registry image URI.
image = "registry.cloudflare.com/archive-center/archive-center-go:render-me"
max_instances = 1
# An explicit instance type, because the unset default is not a decision this
# deployment may leave to chance. lite carries 256 MiB of memory, and this
# backend holds a turn's candidate pool, hydration buffers and a multi-agent
# round in memory at once. Memory exhaustion during a turn kills the process,
# which drops the in-process turn workflow ledger and strands the HUD stream.
# basic carries 1 GiB. This is a resource floor, not a sleep control:
# sleepAfter above is what governs idling, independently of instance type.
instance_type = "basic"

[observability]
enabled = true
