# Archive Center Cloudflare Worker — deployment template.
#
# This tracked template contains only stable binding names and
# non-account-specific settings. Account IDs, database IDs, index IDs, routes,
# domains, and secrets are intentionally absent: they are rendered into a
# temporary, ignored wrangler.toml at deploy time from local protected values
# (render script arrives in Stage 5). Never commit a rendered wrangler.toml.

name = "archive-center-bridge"
main = "worker/src/index.ts"
compatibility_date = "2026-06-01"

[vars]
# No secrets in tracked config. The shared Container-to-Worker bridge token is
# a Worker secret:
#   wrangler secret put BRIDGE_TOKEN
# The Container receives the same token via AC_CLOUDFLARE_BRIDGE_TOKEN.

[[d1_databases]]
binding = "DB"
database_name = "archive-center-db"
# database_id is account-specific and must be rendered at deploy time.

[vectorize]
binding = "VECTORIZE"
index_name = "archive-center-vectors"
# Vectorize index IDs are account-specific and must be rendered at deploy time.
