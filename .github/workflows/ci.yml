name: Archive Center CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.6"
          check-latest: false
          cache: true
          cache-dependency-path: go-service/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify required source files
        shell: bash
        run: |
          test -f "Archive Center.js"
          test -f "go-service/go.mod"
          test -f "prompts/supervisor_system.txt"
          test -f "prompts/critic_system.txt"
          grep -q '^AC_CHROMA_API_PATH=/api/v2$' .env.example
          grep -q 'chromadb==1.5.9' ops/full-package-posix/start-full-posix.sh
          if grep -R 'AC_CHROMA_API_PATH=/api/v1' .env.example ops/live-test-pack/.env.live.example; then exit 1; fi

      - name: Check JavaScript syntax
        run: node --check "Archive Center.js"

      - name: Install Cloudflare Worker dependencies
        working-directory: deploy/cloudflare/worker
        # npm ci, not npm install. The lockfile is committed and complete, so npm
        # never resolves the dependency graph, and that resolution is the step
        # that crashes under npm 10 with "Cannot read properties of null (reading
        # 'edgesOut')". It is an Arborist bug in the vitest peer set, not a
        # conflict a flag could report, so --legacy-peer-deps was only ever a way
        # of skipping the broken code path.
        run: npm ci --no-audit --no-fund

      - name: Cloudflare Worker type check
        working-directory: deploy/cloudflare/worker
        run: npm run check

      - name: Cloudflare Worker tests
        working-directory: deploy/cloudflare/worker
        # Runs the bridge handlers in real workerd against local D1. The runner
        # script exists because D1 is a disk-backed Durable Object and the
        # repository carries a Low integrity label; on Windows that makes the
        # runtime unable to write to the default %TEMP%. The icacls step is
        # skipped on Linux, where no such rule exists.
        run: npm test

      - name: Cloudflare tracked artifacts are account-neutral
        # The bridge payload test checks what the provider SENDS. This checks what
        # the repository CONTAINS, which a payload test cannot see: a Dockerfile
        # that bakes in a route, a runbook that documents a real database id, or
        # a template that grew a literal index name.
        run: node deploy/cloudflare/scripts/check-artifact-neutrality.mjs

      - name: Cloudflare deploy config renders
        # Validates the tracked template against the renderer without writing
        # anything, using throwaway identifiers. Deploying an unrendered template
        # produces a config whose ids are comments, which wrangler accepts and
        # then fails at runtime on the first query.
        env:
          AC_CLOUDFLARE_D1_DATABASE_ID: 00000000-0000-0000-0000-0000000000fa
          AC_CLOUDFLARE_VECTORIZE_INDEX_ID: 11111111-1111-1111-1111-1111111111fb
        run: node deploy/cloudflare/scripts/render-wrangler-config.mjs --check

      - name: Simple POSIX fresh-install contract
        shell: bash
        run: sh ./scripts/test-simple-fresh-install.sh

      - name: Check Go formatting
        working-directory: go-service
        shell: bash
        run: |
          unformatted="$(find . -type f -name '*.go' -print0 | xargs -0 gofmt -l)"
          test -z "$unformatted" || { printf '%s\n' "$unformatted"; exit 1; }

      - name: Go vet
        working-directory: go-service
        run: go vet ./...

      - name: Core regression contract
        shell: bash
        run: sh ./scripts/test-core-regressions.sh

      - name: Go test
        working-directory: go-service
        run: go test ./... -count=1

      - name: Start ChromaDB 1.5.9
        shell: bash
        run: |
          python -m pip install "chromadb==1.5.9"
          chroma run --host 127.0.0.1 --port 8000 --path "${RUNNER_TEMP}/archive-center-chroma" >"${RUNNER_TEMP}/chromadb.log" 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8000/api/v2/heartbeat >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              cat "${RUNNER_TEMP}/chromadb.log"
              exit 1
            fi
            sleep 1
          done

      - name: ChromaDB 1.5.9 API v2 integration
        working-directory: go-service
        env:
          AC_CHROMA_INTEGRATION_ENDPOINT: http://127.0.0.1:8000
        run: go test ./internal/vector -run TestChroma159V2Integration -count=1 -v

      - name: Build backend
        working-directory: go-service
        run: go build ./cmd/archive-center-go

      - name: Install govulncheck
        working-directory: go-service
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4

      - name: Vulnerability scan
        working-directory: go-service
        run: govulncheck ./...

  simple-fresh-install-windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.6"
          check-latest: false
          cache: true
          cache-dependency-path: go-service/go.sum

      - name: Simple Windows and generated macOS launcher contracts
        shell: powershell
        run: .\scripts\test-simple-fresh-install.ps1

      - name: Service port configuration
        shell: powershell
        run: .\scripts\test-chromadb-port.ps1

  simple-fresh-install-posix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.6"
          cache: true
          cache-dependency-path: go-service/go.sum

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: POSIX bootstrap completion before service registration
        run: python3 ./scripts/test-posix-bootstrap-completion.py

      - name: Production POSIX fresh-install contracts
        shell: bash
        run: sh ./scripts/test-simple-fresh-install.sh

      - name: Service port configuration
        shell: bash
        run: sh ./scripts/test-chromadb-port.sh

      - name: Native updater transaction tests
        working-directory: go-service
        run: go test ./internal/packageupdate ./cmd/archive-center-updater -count=1
